
name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pc-virtual:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ==========================================
      # 1. RESTAURAR DOWNLOADS ANTERIORES
      # ==========================================

      - name: Restaurar downloads anteriores
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $downloads = "$env:USERPROFILE\Downloads"
          $temp = "$env:RUNNER_TEMP\pc-restore"

          New-Item -ItemType Directory -Force -Path $downloads | Out-Null
          New-Item -ItemType Directory -Force -Path $temp | Out-Null

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $repo = $env:GITHUB_REPOSITORY
          $url = "https://api.github.com/repos/$repo/actions/artifacts?name=pc-virtual-downloads&per_page=100"

          try {
            $result = Invoke-RestMethod -Uri $url -Headers $headers

            $artifact = $result.artifacts |
              Where-Object {
                $_.name -eq "pc-virtual-downloads" -and
                -not $_.expired -and
                $_.workflow_run.id -ne [long]$env:GITHUB_RUN_ID
              } |
              Sort-Object created_at -Descending |
              Select-Object -First 1

            if ($artifact) {
              $archive = "$temp\backup.zip"

              Invoke-WebRequest `
                -Uri $artifact.archive_download_url `
                -Headers $headers `
                -OutFile $archive

              Expand-Archive -Path $archive -DestinationPath $downloads -Force

              Write-Host "Downloads restaurados!"
            }
            else {
              Write-Host "Nenhum backup anterior encontrado."
            }
          }
          catch {
            Write-Warning "Falha ao restaurar: $_"
          }

      # ==========================================
      # 2. LOCALIZAR E INSTALAR CLAUDE
      # ==========================================

      - name: Instalar Claude Desktop
        shell: pwsh
        timeout-minutes: 15
        run: |
          $downloads = "$env:USERPROFILE\Downloads"

          $msix = Get-ChildItem $downloads -File -Recurse |
            Where-Object {
              $_.Name -match '^Claude.*\.(msix|msixbundle)$'
            } |
            Select-Object -First 1

          $exe = Get-ChildItem $downloads -File -Recurse |
            Where-Object {
              $_.Name -match '^Claude.*\.exe$'
            } |
            Select-Object -First 1

          if ($msix) {
            Write-Host "Pacote MSIX encontrado: $($msix.Name)"

            Add-AppxPackage -Path $msix.FullName -ErrorAction Stop

          }
          elseif ($exe) {
            Write-Host "Instalador encontrado: $($exe.FullName)"

            $signature = Get-AuthenticodeSignature $exe.FullName

            if ($signature.Status -ne "Valid") {
              throw "Assinatura do Claude inválida."
            }

            Write-Host "Executando instalador sem parâmetros não documentados..."

            $process = Start-Process `
              -FilePath $exe.FullName `
              -Wait `
              -PassThru

            Write-Host "Código de saída: $($process.ExitCode)"

            $package = Get-AppxPackage |
              Where-Object { $_.Name -match "Claude" }

            if (-not $package) {
              throw "Claude não foi registrado. O instalador EXE pode exigir interação ou privilégios."
            }
          }
          else {
            throw "Nenhum instalador Claude encontrado em Downloads."
          }

          Write-Host "Claude instalado!"

      # ==========================================
      # 3. LOCALIZAR E INSTALAR ROBLOX STUDIO
      # ==========================================

      - name: Instalar Roblox Studio
        shell: pwsh
        timeout-minutes: 15
        run: |
          $downloads = "$env:USERPROFILE\Downloads"

          $studio = Get-ChildItem $downloads -File -Recurse |
            Where-Object {
              $_.Name -match '^RobloxStudio.*\.exe$'
            } |
            Select-Object -First 1

          if (-not $studio) {
            throw "Instalador Roblox Studio não encontrado."
          }

          Write-Host "Instalador: $($studio.FullName)"

          $signature = Get-AuthenticodeSignature $studio.FullName

          if ($signature.Status -ne "Valid") {
            throw "Assinatura do instalador Roblox inválida."
          }

          $process = Start-Process `
            -FilePath $studio.FullName `
            -PassThru

          $mcp = "$env:LOCALAPPDATA\Roblox\mcp.bat"

          $installed = $false

          for ($i = 0; $i -lt 120; $i++) {
            if (Test-Path $mcp) {
              $installed = $true
              break
            }

            Start-Sleep -Seconds 5
          }

          if (-not $installed) {
            throw "MCP do Roblox Studio não apareceu. Verifique se o instalador concluiu."
          }

          Write-Host "Roblox Studio instalado!"
          Write-Host "MCP localizado: $mcp"

      # ==========================================
      # 4. CONFIGURAR MCP DO ROBLOX NO CLAUDE
      # ==========================================

      - name: Configurar Roblox MCP no Claude
        shell: pwsh
        run: |
          $configDir = "$env:APPDATA\Claude"
          $configFile = Join-Path $configDir "claude_desktop_config.json"

          $mcp = "$env:LOCALAPPDATA\Roblox\mcp.bat"

          if (-not (Test-Path $mcp)) {
            throw "mcp.bat não encontrado."
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $configDir | Out-Null

          $config = @{
            mcpServers = @{
              Roblox_Studio = @{
                command = "cmd.exe"
                args = @(
                  "/c",
                  "%LOCALAPPDATA%\Roblox\mcp.bat"
                )
              }
            }
          }

          $config | ConvertTo-Json -Depth 10 |
            Set-Content -Path $configFile -Encoding UTF8

          Write-Host "Configuração MCP criada!"
          Write-Host $configFile

      # ==========================================
      # 5. INSTALAR ANYDESK
      # ==========================================

      - name: Instalar AnyDesk e mostrar ID e senha
        shell: pwsh
        timeout-minutes: 15
        run: |
          $chars = "abcdefghjkmnpqrstuvwxyz23456789".ToCharArray()
          $pw = "Ab3-" + (-join ($chars | Get-Random -Count 10))

          $ad = "C:\AnyDesk\AnyDesk.exe"

          Invoke-WebRequest `
            -Uri "https://download.anydesk.com/AnyDesk.exe" `
            -OutFile "$env:TEMP\AnyDesk.exe"

          Start-Process `
            "$env:TEMP\AnyDesk.exe" `
            -ArgumentList "--install C:\AnyDesk --start-with-win --silent"

          for ($i = 0; $i -lt 40 -and -not (Test-Path $ad); $i++) {
            Start-Sleep -Seconds 3
          }

          if (-not (Test-Path $ad)) {
            throw "AnyDesk não foi instalado."
          }

          Start-Sleep -Seconds 15

          cmd /c "echo $pw | ""$ad"" --set-password"

          Start-Sleep -Seconds 5

          $id = ""

          for ($i = 0; $i -lt 12 -and -not $id; $i++) {
            $id = (& $ad --get-id | Out-String).Trim()

            if (-not $id) {
              Start-Sleep -Seconds 5
            }
          }

          if (-not $id) {
            throw "Não consegui obter ID do AnyDesk."
          }

          Write-Host ""
          Write-Host "================================"
          Write-Host "ID:    $id"
          Write-Host "SENHA: $pw"
          Write-Host "================================"

      # ==========================================
      # 6. MANTER ATIVO
      # ==========================================

      - name: Manter ativo
        shell: pwsh
        run: |
          Write-Host "PC virtual iniciado!"

          $end = (Get-Date).AddMinutes(350)

          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 60
          }

      # ==========================================
      # 7. PREPARAR BACKUP
      # ==========================================

      - name: Preparar backup dos downloads
        if: always()
        shell: pwsh
        run: |
          $source = "$env:USERPROFILE\Downloads"
          $backup = "$env:RUNNER_TEMP\pc-backup\Downloads"

          New-Item -ItemType Directory -Force -Path $backup | Out-Null

          if (Test-Path $source) {
            Copy-Item `
              "$source\*" `
              $backup `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          if (-not (Get-ChildItem $backup -Force)) {
            New-Item -ItemType File -Path "$backup\.keep" | Out-Null
          }

      # ==========================================
      # 8. SALVAR DOWNLOADS NO GITHUB
      # ==========================================

      - name: Salvar downloads no GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-virtual-downloads
          path: ${{ runner.temp }}/pc-backup/Downloads/
          retention-days: 90
          if-no-files-found: warn
          
