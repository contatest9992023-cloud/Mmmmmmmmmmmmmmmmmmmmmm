
name: RDP Ultimate

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  rdp:
    name: RDP Ultimate - Windows, Claude, Roblox e MCP
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      # =====================================================
      # 1. PREPARAR AMBIENTE
      # =====================================================

      - name: Preparar diretórios
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = "C:\RDP-Ultimate"

          $folders = @(
            "$root",
            "$root\Restore",
            "$root\FinalBackup",
            "$root\Logs",
            "$env:USERPROFILE\Downloads",
            "$env:USERPROFILE\Documents\RobloxProjects",
            "$env:USERPROFILE\Documents\Roblox"
          )

          foreach ($folder in $folders) {
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
          }

          "RDP Ultimate iniciado em $(Get-Date)" |
            Out-File "$root\Logs\run.log" -Encoding utf8

      # =====================================================
      # 2. LOCALIZAR BACKUP DA EXECUÇÃO ANTERIOR
      # =====================================================

      - name: Localizar backup anterior
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "rdp-ultimate.yml",
              status: "success",
              per_page: 20
            });

            for (const run of runs.data.workflow_runs) {
              if (run.id === context.runId) continue;

              const result = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100
              });

              const artifact = result.data.artifacts.find(
                item => item.name === "rdp-ultimate-backup" && !item.expired
              );

              if (artifact) {
                core.setOutput("found", "true");
                core.setOutput("run_id", String(run.id));
                core.info(`Backup encontrado na execução ${run.id}`);
                return;
              }
            }

            core.setOutput("found", "false");
            core.info("Nenhum backup anterior encontrado.");

      - name: Baixar backup anterior
        if: steps.previous.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: rdp-ultimate-backup
          path: C:\RDP-Ultimate\Restore
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous.outputs.run_id }}

      # =====================================================
      # 3. RESTAURAR ARQUIVOS E CONFIGURAÇÕES
      # =====================================================

      - name: Restaurar arquivos anteriores
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $restore = "C:\RDP-Ultimate\Restore"
          $archives = Get-ChildItem $restore -Filter "*.zip" -File -Recurse

          if ($archives.Count -eq 0) {
            Write-Host "Nenhum arquivo de backup para restaurar."
            exit 0
          }

          foreach ($archive in $archives) {
            Write-Host "Restaurando: $($archive.FullName)"

            Expand-Archive `
              -LiteralPath $archive.FullName `
              -DestinationPath $env:USERPROFILE `
              -Force
          }

          Write-Host "Restauração concluída."

      # =====================================================
      # 4. INSTALAR CLAUDE DESKTOP
      # =====================================================

      - name: Instalar Claude Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installed = Get-AppxPackage -Name "Claude" -ErrorAction SilentlyContinue

          if ($installed) {
            Write-Host "Claude Desktop já está instalado."
          }
          else {
            $winget = Get-Command winget.exe -ErrorAction SilentlyContinue

            if (!$winget) {
              throw "Winget não está disponível neste runner. Não foi possível instalar Claude."
            }

            winget install `
              --id Anthropic.Claude `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements

            if ($LASTEXITCODE -ne 0) {
              throw "Falha na instalação do Claude Desktop. Código: $LASTEXITCODE"
            }
          }

          Start-Sleep -Seconds 5

          $installed = Get-AppxPackage -Name "Claude" -ErrorAction SilentlyContinue

          if (!$installed) {
            throw "A instalação do Claude não foi confirmada."
          }

          Write-Host "Claude Desktop instalado e identificado."

      # =====================================================
      # 5. INSTALAR ROBLOX STUDIO
      # =====================================================

      - name: Instalar Roblox Studio
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $mcp = "$env:LOCALAPPDATA\Roblox\mcp.bat"

          if (!(Test-Path $mcp)) {
            $installer = "$env:TEMP\RobloxStudioInstaller.exe"

            Invoke-WebRequest `
              -Uri "https://setup.rbxcdn.com/RobloxStudioInstaller.exe" `
              -OutFile $installer

            if (!(Test-Path $installer)) {
              throw "Não foi possível baixar o instalador do Roblox Studio."
            }

            $process = Start-Process `
              -FilePath $installer `
              -Wait `
              -PassThru

            Write-Host "Instalador encerrado com código $($process.ExitCode)"

            # Aguardar os arquivos do Studio aparecerem
            $found = $false

            for ($i = 0; $i -lt 36; $i++) {
              if (Test-Path $mcp) {
                $found = $true
                break
              }

              Start-Sleep -Seconds 5
            }

            if (!$found) {
              throw "O Roblox Studio não disponibilizou o mcp.bat após a instalação."
            }
          }

          $studio = Get-ChildItem `
            "$env:LOCALAPPDATA\Roblox\Versions" `
            -Filter "RobloxStudioBeta.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (!$studio) {
            throw "RobloxStudioBeta.exe não foi encontrado."
          }

          "ROBLOX_STUDIO=$($studio.FullName)" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Roblox Studio localizado: $($studio.FullName)"
          Write-Host "Servidor MCP localizado: $mcp"

      # =====================================================
      # 6. CONFIGURAR MCP DENTRO DO CLAUDE
      # =====================================================

      - name: Configurar servidor MCP do Roblox no Claude
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $configDir = "$env:APPDATA\Claude"
          $configFile = "$configDir\claude_desktop_config.json"
          $mcpFile = "$env:LOCALAPPDATA\Roblox\mcp.bat"

          New-Item -ItemType Directory -Force -Path $configDir | Out-Null

          if (!(Test-Path $mcpFile)) {
            throw "mcp.bat não encontrado. Não é possível configurar o servidor."
          }

          # Preservar os servidores MCP já existentes
          if (Test-Path $configFile) {
            try {
              $config = Get-Content $configFile -Raw |
                ConvertFrom-Json -AsHashtable
            }
            catch {
              $backupInvalid = "$configFile.invalid-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
              Copy-Item $configFile $backupInvalid
              throw "A configuração anterior do Claude contém JSON inválido. Cópia preservada em $backupInvalid"
            }
          }
          else {
            $config = @{}
          }

          if (!$config.ContainsKey("mcpServers") -or $null -eq $config["mcpServers"]) {
            $config["mcpServers"] = @{}
          }

          # Configuração oficial do Roblox Studio MCP
          $config["mcpServers"]["Roblox_Studio"] = @{
            command = "cmd.exe"
            args = @(
              "/c",
              "%LOCALAPPDATA%\Roblox\mcp.bat"
            )
          }

          $json = $config | ConvertTo-Json -Depth 100

          Set-Content `
            -Path $configFile `
            -Value $json `
            -Encoding utf8

          # Validar JSON gravado
          $null = Get-Content $configFile -Raw | ConvertFrom-Json

          Write-Host "Configuração MCP gravada:"
          Write-Host $configFile
          Write-Host "Roblox_Studio adicionado sem apagar os outros servidores."

      # =====================================================
      # 7. INSTALAR ANYDESK
      # =====================================================

      - name: Instalar AnyDesk
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:TEMP\AnyDesk.exe"
          $installDir = Join-Path ${env:ProgramFiles(x86)} "AnyDesk"

          Invoke-WebRequest `
            -Uri "https://download.anydesk.com/AnyDesk.exe" `
            -OutFile $installer

          if (!(Test-Path $installer)) {
            throw "Instalador do AnyDesk não encontrado."
          }

          if ((Get-Item $installer).Length -lt 1MB) {
            throw "O instalador do AnyDesk parece inválido."
          }

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              "--install",
              "`"$installDir`"",
              "--start-with-win",
              "--create-shortcuts",
              "--silent"
            ) `
            -Wait `
            -PassThru

          Start-Sleep -Seconds 5

          $exe = Join-Path $installDir "AnyDesk.exe"

          if (!(Test-Path $exe)) {
            $exe = "$env:ProgramFiles\AnyDesk\AnyDesk.exe"
          }

          if (!(Test-Path $exe)) {
            throw "AnyDesk não foi encontrado após a instalação. Código: $($process.ExitCode)"
          }

          "ANYDESK_EXE=$exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "AnyDesk instalado: $exe"

      # =====================================================
      # 8. GERAR SENHA E CAPTURAR ID REAL DO ANYDESK
      # =====================================================

      - name: Gerar acesso AnyDesk
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = $env:ANYDESK_EXE

          & $exe --start
          Start-Sleep -Seconds 10

          # Gerar senha aleatória
          $bytes = New-Object byte[] 24

          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          $rng.GetBytes($bytes)
          $rng.Dispose()

          $password = [Convert]::ToBase64String($bytes).TrimEnd('=')

          # Configurar acesso não supervisionado
          $password | & $exe --set-password _unattended_access

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao configurar a senha do AnyDesk."
          }

          # O AnyDesk não imprime o ID diretamente no console.
          # Capturar através do comando batch.
          $batch = "$env:TEMP\get-anydesk-id.cmd"

          @"
          @echo off
          for /f "delims=" %%i in ('"$exe" --get-id') do echo %%i
          "@ | Set-Content -Path $batch -Encoding ASCII

          $id = $null

          for ($attempt = 1; $attempt -le 18; $attempt++) {
            $output = & cmd.exe /c $batch 2>$null

            $id = $output |
              ForEach-Object { "$_".Trim() } |
              Where-Object { $_ -match '^[0-9]{6,}$' } |
              Select-Object -First 1

            if ($id) {
              break
            }

            Start-Sleep -Seconds 5
          }

          if (!$id) {
            throw "AnyDesk não forneceu um ID válido."
          }

          # Exibir no resumo e nos logs
          Add-Content $env:GITHUB_STEP_SUMMARY "## ACESSO ANYDESK"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Add-Content $env:GITHUB_STEP_SUMMARY "**ID:** $id"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Add-Content $env:GITHUB_STEP_SUMMARY "**SENHA:** $password"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "             ACESSO ANYDESK"
          Write-Host "========================================"
          Write-Host "ID: $id"
          Write-Host "SENHA: $password"
          Write-Host "========================================"

      # =====================================================
      # 9. ABRIR ROBLOX STUDIO E CLAUDE
      # =====================================================

      - name: Iniciar Roblox Studio e Claude
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          # Abrir Roblox Studio
          if (Test-Path $env:ROBLOX_STUDIO) {
            Start-Process -FilePath $env:ROBLOX_STUDIO
            Write-Host "Roblox Studio iniciado."
          }
          else {
            Write-Warning "Executável do Roblox Studio não localizado."
          }

          Start-Sleep -Seconds 5

          # Localizar Claude no menu de aplicativos
          $claudeApp = Get-StartApps |
            Where-Object { $_.Name -match "Claude" } |
            Select-Object -First 1

          if ($claudeApp) {
            Start-Process explorer.exe -ArgumentList "shell:AppsFolder\$($claudeApp.AppID)"
            Write-Host "Claude Desktop iniciado."
          }
          else {
            Write-Warning "Claude instalado, mas não foi localizado no menu de aplicativos."
          }

      # =====================================================
      # 10. RELATÓRIO DO AMBIENTE
      # =====================================================

      - name: Gerar relatório
        if: always()
        shell: pwsh
        run: |
          $root = "C:\RDP-Ultimate"
          $report = "$root\FinalBackup\Meta\report.txt"

          New-Item -ItemType Directory -Force -Path (Split-Path $report) | Out-Null

          $lines = @(
            "RDP ULTIMATE",
            "Data: $(Get-Date)",
            "Windows: $([System.Environment]::OSVersion.VersionString)",
            "Usuário: $env:USERNAME",
            "Claude config: $env:APPDATA\Claude\claude_desktop_config.json",
            "Roblox MCP: $env:LOCALAPPDATA\Roblox\mcp.bat",
            "Roblox Studio: $env:ROBLOX_STUDIO",
            "AnyDesk: $env:ANYDESK_EXE"
          )

          $lines | Set-Content $report -Encoding utf8

          Get-Content $report

      # =====================================================
      # 11. MANTER WINDOWS ATIVO
      # =====================================================

      - name: Manter Windows ativo
        shell: pwsh
        run: |
          Write-Host "Ambiente iniciado."
          Write-Host "Tempo máximo reservado para uso: 330 minutos."

          for ($minute = 1; $minute -le 330; $minute++) {
            Start-Sleep -Seconds 60

            if (($minute % 5) -eq 0) {
              Write-Host "Runner ativo há $minute minutos."
            }
          }

      # =====================================================
      # 12. PREPARAR BACKUP INCREMENTAL
      # =====================================================

      - name: Preparar backup final
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $root = "C:\RDP-Ultimate"
          $stage = "$root\FinalBackup"

          $paths = @(
            "$stage\Downloads",
            "$stage\Documents\RobloxProjects",
            "$stage\Documents\Roblox",
            "$stage\AppData\Roaming\Claude",
            "$stage\Meta"
          )

          foreach ($path in $paths) {
            New-Item -ItemType Directory -Force -Path $path | Out-Null
          }

          # Downloads
          if (Test-Path "$env:USERPROFILE\Downloads") {
            robocopy `
              "$env:USERPROFILE\Downloads" `
              "$stage\Downloads" `
              /E /R:1 /W:1 /NFL /NDL /NJH /NJS

            if ($LASTEXITCODE -ge 8) {
              Write-Warning "Alguns arquivos de Downloads não puderam ser copiados."
            }
          }

          # Projetos Roblox
          $robloxPaths = @(
            @{
              Source = "$env:USERPROFILE\Documents\RobloxProjects"
              Target = "$stage\Documents\RobloxProjects"
            },
            @{
              Source = "$env:USERPROFILE\Documents\Roblox"
              Target = "$stage\Documents\Roblox"
            }
          )

          foreach ($item in $robloxPaths) {
            if (Test-Path $item.Source) {
              robocopy `
                $item.Source `
                $item.Target `
                /E /R:1 /W:1 /NFL /NDL /NJH /NJS

              if ($LASTEXITCODE -ge 8) {
                Write-Warning "Falha parcial no backup: $($item.Source)"
              }
            }
          }

          # Configuração MCP do Claude
          $claudeConfig = "$env:APPDATA\Claude\claude_desktop_config.json"

          if (Test-Path $claudeConfig) {
            Copy-Item `
              $claudeConfig `
              "$stage\AppData\Roaming\Claude\claude_desktop_config.json" `
              -Force
          }

          # Logs
          $log = "$stage\Meta\run.log"

          @(
            "Backup executado em $(Get-Date)",
            "Run ID: $env:GITHUB_RUN_ID",
            "Repositório: $env:GITHUB_REPOSITORY",
            "Roblox Studio: $env:ROBLOX_STUDIO"
          ) | Set-Content $log -Encoding utf8

          # Não copiar cookies, senhas, tokens ou sessões privadas.
          # Eles não fazem parte do backup de projetos e configurações.

          # Criar ZIP
          $zip = "$root\rdp-ultimate-backup.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "$stage\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal `
            -Force

          if (Test-Path $zip) {
            Write-Host "Backup criado: $zip"
            Write-Host "Tamanho: $((Get-Item $zip).Length) bytes"
          }
          else {
            Write-Warning "Não foi possível gerar o arquivo ZIP."
          }

      # =====================================================
      # 13. SALVAR BACKUP PARA A PRÓXIMA EXECUÇÃO
      # =====================================================

      - name: Salvar backup incremental
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-ultimate-backup
          path: C:\RDP-Ultimate\rdp-ultimate-backup.zip
          if-no-files-found: warn
          retention-days: 30
          
