name: RDP Ultimate v15

on:
  workflow_dispatch:
    inputs:
      keep_alive_minutes:
        description: "Tempo para manter o ambiente ativo (máximo 330 minutos)"
        required: true
        type: number
        default: 330

permissions:
  actions: read
  contents: read

jobs:
  rdp:
    name: RDP Ultimate v15
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      BACKUP_NAME: rdp-ultimate-backup
      WORK_DIR: C:\RDP-Ultimate
      BACKUP_DIR: C:\RDP-Ultimate\Backup
      LOG_FILE: C:\RDP-Ultimate\run.log

    steps:
      # 1. Preparar pastas e registrar o início
      - name: Preparar ambiente
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:WORK_DIR | Out-Null
          New-Item -ItemType Directory -Force -Path $env:BACKUP_DIR | Out-Null

          "RDP Ultimate v15 - início: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" |
            Set-Content $env:LOG_FILE

          "Runner: $env:RUNNER_NAME" | Add-Content $env:LOG_FILE
          "Sistema: $([System.Environment]::OSVersion.VersionString)" |
            Add-Content $env:LOG_FILE

      # 2. Recuperar o último backup de uma execução anterior
      - name: Restaurar backup anterior
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $api = "https://api.github.com/repos/$env:GH_REPOSITORY/actions/artifacts?name=$env:BACKUP_NAME&per_page=100"

          try {
            $response = Invoke-RestMethod -Uri $api -Headers $headers
            $artifact = $response.artifacts |
              Where-Object { -not $_.expired } |
              Sort-Object created_at -Descending |
              Select-Object -First 1

            if (-not $artifact) {
              "Nenhum backup anterior encontrado." |
                Tee-Object -FilePath $env:LOG_FILE -Append
              exit 0
            }

            $zip = Join-Path $env:WORK_DIR "previous-backup.zip"
            $extract = Join-Path $env:WORK_DIR "Restored"

            Invoke-WebRequest `
              -Uri $artifact.archive_download_url `
              -Headers $headers `
              -OutFile $zip

            if (Test-Path $extract) {
              Remove-Item $extract -Recurse -Force
            }

            Expand-Archive -Path $zip -DestinationPath $extract -Force

            $downloads = Join-Path $extract "Downloads"
            if (Test-Path $downloads) {
              New-Item -ItemType Directory -Force "$env:USERPROFILE\Downloads" | Out-Null
              Copy-Item "$downloads\*" "$env:USERPROFILE\Downloads" -Recurse -Force
            }

            $projects = Join-Path $extract "RobloxProjects"
            if (Test-Path $projects) {
              New-Item -ItemType Directory -Force "$env:USERPROFILE\Documents\RobloxProjects" | Out-Null
              Copy-Item "$projects\*" "$env:USERPROFILE\Documents\RobloxProjects" -Recurse -Force
            }

            $robloxDocs = Join-Path $extract "Roblox"
            if (Test-Path $robloxDocs) {
              New-Item -ItemType Directory -Force "$env:USERPROFILE\Documents\Roblox" | Out-Null
              Copy-Item "$robloxDocs\*" "$env:USERPROFILE\Documents\Roblox" -Recurse -Force
            }

            $claudeConfig = Join-Path $extract "ClaudeConfig\claude_desktop_config.json"
            if (Test-Path $claudeConfig) {
              $configDir = Join-Path $env:APPDATA "Claude"
              New-Item -ItemType Directory -Force $configDir | Out-Null
              Copy-Item $claudeConfig (Join-Path $configDir "claude_desktop_config.json") -Force
            }

            "Backup restaurado: $($artifact.created_at)" |
              Tee-Object -FilePath $env:LOG_FILE -Append
          }
          catch {
            "AVISO: não foi possível restaurar o backup: $($_.Exception.Message)" |
              Tee-Object -FilePath $env:LOG_FILE -Append
          }

      # 3. Instalar e iniciar AnyDesk
      - name: Instalar e iniciar AnyDesk
        shell: pwsh
        env:
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |
          try {
            $installDir = "C:\Program Files (x86)\AnyDesk"
            New-Item -ItemType Directory -Force $installDir | Out-Null

            $anydesk = Get-ChildItem $installDir -Filter "AnyDesk.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if (-not $anydesk) {
              $installer = Join-Path $env:TEMP "AnyDesk-Installer.exe"

              Invoke-WebRequest `
                -Uri "https://download.anydesk.com/AnyDesk.exe" `
                -OutFile $installer

              $process = Start-Process `
                -FilePath $installer `
                -ArgumentList @("--install", $installDir, "--start-with-win", "--silent", "--create-shortcuts") `
                -Wait `
                -PassThru

              Start-Sleep -Seconds 5

              $anydesk = Get-ChildItem $installDir -Filter "AnyDesk.exe" -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if (-not $anydesk) {
                throw "O executável do AnyDesk não apareceu após a instalação. Código: $($process.ExitCode)"
              }
            }

            $anydeskExe = $anydesk.FullName

            try {
              & $anydeskExe --start | Out-Null
              Start-Sleep -Seconds 4
            }
            catch {
              "Aviso ao iniciar o serviço AnyDesk: $($_.Exception.Message)" |
                Add-Content $env:LOG_FILE
            }

            if (-not [string]::IsNullOrWhiteSpace($env:ANYDESK_PASSWORD)) {
              $env:ANYDESK_PASSWORD | & $anydeskExe --set-password 2>&1 |
                Out-Null
              "Senha de acesso não supervisionado configurada pelo Secret." |
                Add-Content $env:LOG_FILE
            }
            else {
              "ANYDESK_PASSWORD não configurado; senha não foi alterada." |
                Add-Content $env:LOG_FILE
            }

            $anydeskId = (& $anydeskExe --get-id 2>$null | Out-String).Trim()

            "AnyDesk executável: $anydeskExe" |
              Tee-Object -FilePath $env:LOG_FILE -Append

            "AnyDesk ID: $anydeskId" |
              Tee-Object -FilePath $env:LOG_FILE -Append

            "ANYDESK_ID=$anydeskId" >> $env:GITHUB_ENV
          }
          catch {
            "FALHA NO ANYDESK: $($_.Exception.Message)" |
              Tee-Object -FilePath $env:LOG_FILE -Append
          }

      # 4. Instalar ou iniciar Roblox Studio
      - name: Verificar Roblox Studio
        shell: pwsh
        run: |
          try {
            $downloads = Join-Path $env:USERPROFILE "Downloads"

            $studio = Get-ChildItem "$env:LOCALAPPDATA\Roblox\Versions" `
              -Filter "RobloxStudioBeta.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if (-not $studio) {
              $installer = Get-ChildItem $downloads -File -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Name -match "RobloxStudioInstaller.*\.exe"
                } |
                Select-Object -First 1

              if ($installer) {
                "Instalador do Roblox encontrado: $($installer.Name)" |
                  Add-Content $env:LOG_FILE

                $process = Start-Process -FilePath $installer.FullName -PassThru
                "Instalador Roblox iniciado. PID: $($process.Id)" |
                  Add-Content $env:LOG_FILE

                $deadline = (Get-Date).AddMinutes(4)

                do {
                  Start-Sleep -Seconds 8

                  $studio = Get-ChildItem "$env:LOCALAPPDATA\Roblox\Versions" `
                    -Filter "RobloxStudioBeta.exe" `
                    -Recurse `
                    -ErrorAction SilentlyContinue |
                    Select-Object -First 1

                } while (-not $studio -and (Get-Date) -lt $deadline)
              }
            }

            if ($studio) {
              "Roblox Studio encontrado: $($studio.FullName)" |
                Tee-Object -FilePath $env:LOG_FILE -Append

              Start-Process -FilePath $studio.FullName
              "Roblox Studio iniciado." | Add-Content $env:LOG_FILE
            }
            else {
              "AVISO: Roblox Studio não foi localizado. Verifique o instalador em Downloads." |
                Add-Content $env:LOG_FILE
            }
          }
          catch {
            "ERRO ROBLOX: $($_.Exception.Message)" |
              Tee-Object -FilePath $env:LOG_FILE -Append
          }

      # 5. Instalar ou iniciar Claude Desktop
      - name: Verificar Claude Desktop
        shell: pwsh
        run: |
          try {
            $claudeCandidates = @(
              "$env:LOCALAPPDATA\Programs\Claude\Claude.exe",
              "$env:LOCALAPPDATA\Claude\Claude.exe",
              "$env:ProgramFiles\Claude\Claude.exe"
            )

            $claudeExe = $claudeCandidates |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1

            if (-not $claudeExe) {
              $installer = Get-ChildItem "$env:USERPROFILE\Downloads" `
                -Filter "*Claude*Setup*.exe" `
                -File `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($installer) {
                "Instalador Claude encontrado: $($installer.Name)" |
                  Add-Content $env:LOG_FILE

                $process = Start-Process -FilePath $installer.FullName -PassThru
                "Instalador Claude iniciado. PID: $($process.Id)" |
                  Add-Content $env:LOG_FILE

                Start-Sleep -Seconds 20

                $claudeExe = $claudeCandidates |
                  Where-Object { Test-Path $_ } |
                  Select-Object -First 1
              }
            }

            if ($claudeExe) {
              "Claude encontrado: $claudeExe" |
                Tee-Object -FilePath $env:LOG_FILE -Append

              Start-Process -FilePath $claudeExe
              "Claude iniciado." | Add-Content $env:LOG_FILE
            }
            else {
              "AVISO: Claude não foi localizado. O instalador pode exigir interação." |
                Add-Content $env:LOG_FILE
            }
          }
          catch {
            "ERRO CLAUDE: $($_.Exception.Message)" |
              Tee-Object -FilePath $env:LOG_FILE -Append
          }

      # 6. Configurar MCP sem apagar os demais servidores
      - name: Configurar MCP do Roblox no Claude
        shell: pwsh
        run: |
          try {
            $robloxRoot = Join-Path $env:LOCALAPPDATA "Roblox"

            $mcp = Get-ChildItem $robloxRoot `
              -Filter "mcp.bat" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if (-not $mcp) {
              "AVISO: mcp.bat genuíno não encontrado. MCP não foi sobrescrito." |
                Add-Content $env:LOG_FILE
              exit 0
            }

            $configDir = Join-Path $env:APPDATA "Claude"
            $configPath = Join-Path $configDir "claude_desktop_config.json"

            New-Item -ItemType Directory -Force $configDir | Out-Null

            if (Test-Path $configPath) {
              $raw = Get-Content $configPath -Raw
              if ([string]::IsNullOrWhiteSpace($raw)) {
                $config = @{}
              }
              else {
                $config = $raw | ConvertFrom-Json -AsHashtable
              }
            }
            else {
              $config = @{}
            }

            if (-not $config.ContainsKey("mcpServers") -or
                $config["mcpServers"] -isnot [System.Collections.IDictionary]) {
              $config["mcpServers"] = @{}
            }

            $mcpCommand = 'cd /d "' + $mcp.Directory.FullName + '" && call mcp.bat'

            $config["mcpServers"]["Roblox_Studio"] = @{
              command = "cmd.exe"
              args = @("/d", "/s", "/c", $mcpCommand)
            }

            $config |
              ConvertTo-Json -Depth 30 |
              Set-Content -Path $configPath -Encoding UTF8

            "MCP configurado usando: $($mcp.FullName)" |
              Tee-Object -FilePath $env:LOG_FILE -Append

            "Configuração Claude: $configPath" |
              Add-Content $env:LOG_FILE
          }
          catch {
            "ERRO MCP: $($_.Exception.Message)" |
              Tee-Object -FilePath $env:LOG_FILE -Append
          }

      # 7. Gerar relatório antes do período de uso
      - name: Exibir resumo de conexão
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "          RDP ULTIMATE v15"
          Write-Host "========================================"
          Write-Host "AnyDesk ID: $env:ANYDESK_ID"
          Write-Host "Tempo solicitado: ${{ inputs.keep_alive_minutes }} minutos"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Consulte os logs desta execução para ver os avisos."

      # 8. Manter a execução ativa
      - name: Manter ambiente ativo
        shell: pwsh
        run: |
          $minutes = [int]"${{ inputs.keep_alive_minutes }}"

          if ($minutes -lt 1) {
            $minutes = 1
          }

          if ($minutes -gt 330) {
            $minutes = 330
          }

          "Ambiente mantido ativo por $minutes minutos." |
            Tee-Object -FilePath $env:LOG_FILE -Append

          $end = (Get-Date).AddMinutes($minutes)

          while ((Get-Date) -lt $end) {
            $remaining = [math]::Ceiling(($end - (Get-Date)).TotalMinutes)
            Write-Host "RDP Ultimate ativo. Minutos restantes: $remaining"
            Start-Sleep -Seconds 60
          }

      # 9. Montar backup dos arquivos do usuário
      - name: Preparar backup final
        if: always()
        shell: pwsh
        run: |
          $stage = Join-Path $env:WORK_DIR "FinalBackup"

          if (Test-Path $stage) {
            Remove-Item $stage -Recurse -Force
          }

          New-Item -ItemType Directory -Force $stage | Out-Null

          function Copy-FolderIfExists {
            param(
              [string]$Source,
              [string]$Destination
            )

            if (Test-Path $Source) {
              New-Item -ItemType Directory -Force $Destination | Out-Null
              Copy-Item "$Source\*" $Destination -Recurse -Force -ErrorAction Continue
            }
          }

          Copy-FolderIfExists `
            "$env:USERPROFILE\Downloads" `
            "$stage\Downloads"

          Copy-FolderIfExists `
            "$env:USERPROFILE\Documents\RobloxProjects" `
            "$stage\RobloxProjects"

          Copy-FolderIfExists `
            "$env:USERPROFILE\Documents\Roblox" `
            "$stage\Roblox"

          $configPath = Join-Path $env:APPDATA "Claude\claude_desktop_config.json"
          if (Test-Path $configPath) {
            New-Item -ItemType Directory -Force "$stage\ClaudeConfig" | Out-Null
            Copy-Item $configPath "$stage\ClaudeConfig\claude_desktop_config.json" -Force
          }

          New-Item -ItemType Directory -Force "$stage\Meta" | Out-Null

          if (Test-Path $env:LOG_FILE) {
            Copy-Item $env:LOG_FILE "$stage\Meta\run.log" -Force
          }

          @"
          RDP Ultimate v15
          Data: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')
          Repositório: $env:GITHUB_REPOSITORY
          Execução: $env:GITHUB_RUN_ID
          AnyDesk ID: $env:ANYDESK_ID
          "@ | Set-Content "$stage\Meta\report.txt"

          "Backup preparado em: $stage" |
            Add-Content $env:LOG_FILE

      # 10. Enviar backup para o GitHub
      - name: Salvar backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-ultimate-backup
          path: C:\RDP-Ultimate\FinalBackup\
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      # 11. Mostrar relatório final
      - name: Relatório final
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========== RDP ULTIMATE v15 =========="

          if (Test-Path $env:LOG_FILE) {
            Get-Content $env:LOG_FILE
          }

          Write-Host "======================================"
