
name: RDP Ultimate v15

on:
  workflow_dispatch:
    inputs:
      keep_alive_minutes:
        description: "Tempo ativo em minutos (máximo 330)"
        required: true
        type: number
        default: 330

permissions:
  actions: read
  contents: read

jobs:
  rdp:
    name: RDP Ultimate v15
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      BACKUP_NAME: rdp-ultimate-backup
      WORK_DIR: C:\RDP-Ultimate
      LOG_FILE: C:\RDP-Ultimate\run.log

    steps:

      # ==========================================
      # 1. PREPARAR AMBIENTE
      # ==========================================

      - name: Preparar ambiente
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:WORK_DIR | Out-Null

          "RDP Ultimate v15" | Set-Content $env:LOG_FILE
          "Início: $(Get-Date)" | Add-Content $env:LOG_FILE
          "Runner: $env:RUNNER_NAME" | Add-Content $env:LOG_FILE
          "Windows: $([Environment]::OSVersion.VersionString)" |
            Add-Content $env:LOG_FILE

      # ==========================================
      # 2. RESTAURAR BACKUP
      # ==========================================

      - name: Restaurar backup anterior
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $api = "https://api.github.com/repos/$env:GH_REPOSITORY/actions/artifacts?name=$env:BACKUP_NAME&per_page=100"

          try {
            $result = Invoke-RestMethod -Uri $api -Headers $headers

            $artifact = $result.artifacts |
              Where-Object { -not $_.expired } |
              Sort-Object created_at -Descending |
              Select-Object -First 1

            if (-not $artifact) {
              "Nenhum backup anterior encontrado." |
                Add-Content $env:LOG_FILE
              return
            }

            $zip = "$env:WORK_DIR\previous.zip"
            $restore = "$env:WORK_DIR\Restored"

            Invoke-WebRequest `
              -Uri $artifact.archive_download_url `
              -Headers $headers `
              -OutFile $zip

            Expand-Archive $zip $restore -Force

            function Restore-Folder {
              param($Source, $Destination)

              if (Test-Path $Source) {
                New-Item -ItemType Directory -Force $Destination |
                  Out-Null

                Get-ChildItem $Source -Force |
                  Copy-Item -Destination $Destination -Recurse -Force
              }
            }

            Restore-Folder "$restore\Downloads" "$env:USERPROFILE\Downloads"

            Restore-Folder "$restore\RobloxProjects" `
              "$env:USERPROFILE\Documents\RobloxProjects"

            Restore-Folder "$restore\Roblox" `
              "$env:USERPROFILE\Documents\Roblox"

            $config = "$restore\ClaudeConfig\claude_desktop_config.json"

            if (Test-Path $config) {
              $destination = "$env:APPDATA\Claude"
              New-Item -ItemType Directory -Force $destination |
                Out-Null

              Copy-Item $config `
                "$destination\claude_desktop_config.json" -Force
            }

            "Backup restaurado: $($artifact.created_at)" |
              Add-Content $env:LOG_FILE
          }
          catch {
            "AVISO RESTAURAÇÃO: $($_.Exception.Message)" |
              Add-Content $env:LOG_FILE
          }

      # ==========================================
      # 3. ANYDESK - INSTALAÇÃO, ID E SENHA
      # ==========================================

      - name: Instalar e configurar AnyDesk
        shell: pwsh
        env:
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $paths = @(
            "C:\Program Files (x86)\AnyDesk\AnyDesk.exe",
            "C:\Program Files\AnyDesk\AnyDesk.exe"
          )

          $exe = $paths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $exe) {
            $installer = "$env:TEMP\AnyDesk-Installer.exe"

            Invoke-WebRequest `
              "https://download.anydesk.com/AnyDesk.exe" `
              -OutFile $installer

            Start-Process $installer -ArgumentList @(
              "--install",
              "C:\Program Files (x86)\AnyDesk",
              "--start-with-win",
              "--silent",
              "--create-shortcuts"
            ) -Wait

            Start-Sleep -Seconds 8

            $exe = $paths |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
          }

          if (-not $exe) {
            throw "AnyDesk não foi instalado."
          }

          & $exe --start
          Start-Sleep -Seconds 8

          if ([string]::IsNullOrWhiteSpace($env:ANYDESK_PASSWORD)) {
            throw "Secret ANYDESK_PASSWORD não configurado."
          }

          $env:ANYDESK_PASSWORD |
            & $exe --set-password _unattended_access

          Start-Sleep -Seconds 3

          # O AnyDesk não imprime o ID diretamente
          # no console em todas as versões.
          # Capturamos pelo método oficial com FOR /F.

          $batch = "$env:TEMP\get-anydesk-id.cmd"

          @"
          @echo off
          for /f "delims=" %%i in ('"$exe" --get-id') do set "ID=%%i"
          echo %ID%
          "@ | Set-Content $batch -Encoding ASCII

          $id = ""

          for ($i = 0; $i -lt 12; $i++) {
            $output = & cmd.exe /d /c "`"$batch`"" 2>$null
            $id = ($output | Out-String).Trim()

            if ($id -match '^[0-9]{6,}$') {
              break
            }

            Start-Sleep -Seconds 5
          }

          if ($id -notmatch '^[0-9]{6,}$') {
            throw "AnyDesk não forneceu um ID válido."
          }

          "ANYDESK_ID=$id" >> $env:GITHUB_ENV

          "AnyDesk ID: $id" | Add-Content $env:LOG_FILE
          "Senha de acesso não supervisionado configurada." |
            Add-Content $env:LOG_FILE

          "## ACESSO ANYDESK" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "**ID:** $id" >> $env:GITHUB_STEP_SUMMARY
          "**Senha:** use o valor cadastrado em ANYDESK_PASSWORD." `
            >> $env:GITHUB_STEP_SUMMARY

          Write-Host "AnyDesk ID: $id"
          Write-Host "Senha configurada."

      # ==========================================
      # 4. ROBLOX STUDIO
      # ==========================================

      - name: Localizar e instalar Roblox Studio
        shell: pwsh
        run: |
          try {
            $versions = "$env:LOCALAPPDATA\Roblox\Versions"

            $studio = Get-ChildItem $versions `
              -Filter "RobloxStudioBeta.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if (-not $studio) {
              $installer = Get-ChildItem "$env:USERPROFILE\Downloads" `
                -Filter "RobloxStudioInstaller*.exe" `
                -File `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($installer) {
                "Instalador Roblox: $($installer.FullName)" |
                  Add-Content $env:LOG_FILE

                Start-Process $installer.FullName
              }

              $deadline = (Get-Date).AddMinutes(4)

              do {
                Start-Sleep -Seconds 8

                $studio = Get-ChildItem $versions `
                  -Filter "RobloxStudioBeta.exe" `
                  -Recurse `
                  -ErrorAction SilentlyContinue |
                  Select-Object -First 1

              } while (-not $studio -and (Get-Date) -lt $deadline)
            }

            if ($studio) {
              "Roblox Studio: $($studio.FullName)" |
                Add-Content $env:LOG_FILE

              "ROBLOX_STUDIO_EXE=$($studio.FullName)" |
                Add-Content $env:GITHUB_ENV
            }
            else {
              "AVISO: Roblox Studio não localizado." |
                Add-Content $env:LOG_FILE
            }
          }
          catch {
            "ERRO ROBLOX: $($_.Exception.Message)" |
              Add-Content $env:LOG_FILE
          }

      - name: Abrir Roblox Studio
        shell: pwsh
        run: |
          if ($env:ROBLOX_STUDIO_EXE -and
              (Test-Path $env:ROBLOX_STUDIO_EXE)) {

            Start-Process $env:ROBLOX_STUDIO_EXE
            "Roblox Studio iniciado." | Add-Content $env:LOG_FILE
          }
          else {
            "Roblox Studio não disponível para iniciar." |
              Add-Content $env:LOG_FILE
          }

      # ==========================================
      # 5. CLAUDE DESKTOP
      # ==========================================

      - name: Localizar e instalar Claude
        shell: pwsh
        run: |
          try {
            $candidates = @(
              "$env:LOCALAPPDATA\Programs\Claude\Claude.exe",
              "$env:LOCALAPPDATA\Claude\Claude.exe",
              "$env:ProgramFiles\Claude\Claude.exe"
            )

            $claude = $candidates |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1

            if (-not $claude) {
              $installer = Get-ChildItem "$env:USERPROFILE\Downloads" `
                -Filter "*Claude*Setup*.exe" `
                -File `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($installer) {
                "Instalador Claude: $($installer.FullName)" |
                  Add-Content $env:LOG_FILE

                Start-Process $installer.FullName

                $deadline = (Get-Date).AddMinutes(3)

                do {
                  Start-Sleep -Seconds 5

                  $claude = $candidates |
                    Where-Object { Test-Path $_ } |
                    Select-Object -First 1

                } while (-not $claude -and (Get-Date) -lt $deadline)
              }
            }

            if ($claude) {
              "CLAUDE_EXE=$claude" >> $env:GITHUB_ENV
              "Claude localizado: $claude" |
                Add-Content $env:LOG_FILE
            }
            else {
              "AVISO: Claude não localizado ou instalação pendente." |
                Add-Content $env:LOG_FILE
            }
          }
          catch {
            "ERRO CLAUDE: $($_.Exception.Message)" |
              Add-Content $env:LOG_FILE
          }

      # ==========================================
      # 6. CONFIGURAR MCP
      # ==========================================

      - name: Configurar MCP do Roblox
        shell: pwsh
        run: |
          try {
            $robloxRoot = "$env:LOCALAPPDATA\Roblox"

            $mcp = Get-ChildItem $robloxRoot `
              -Filter "mcp.bat" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if (-not $mcp) {
              "AVISO: mcp.bat não encontrado. MCP não alterado." |
                Add-Content $env:LOG_FILE
              return
            }

            $configDir = "$env:APPDATA\Claude"
            $configPath = "$configDir\claude_desktop_config.json"

            New-Item -ItemType Directory -Force $configDir |
              Out-Null

            if (Test-Path $configPath) {
              $raw = Get-Content $configPath -Raw

              if ([string]::IsNullOrWhiteSpace($raw)) {
                $config = @{}
              }
              else {
                $config = $raw | ConvertFrom-Json -AsHashtable
              }
            }
            else {
              $config = @{}
            }

            if (-not $config.ContainsKey("mcpServers") -or
                $config["mcpServers"] -isnot [System.Collections.IDictionary]) {
              $config["mcpServers"] = @{}
            }

            $command = 'cd /d "' +
              $mcp.Directory.FullName +
              '" && call mcp.bat'

            $config["mcpServers"]["Roblox_Studio"] = @{
              command = "cmd.exe"
              args = @("/d", "/c", $command)
            }

            $config |
              ConvertTo-Json -Depth 30 |
              Set-Content $configPath -Encoding UTF8

            "MCP configurado: $($mcp.FullName)" |
              Add-Content $env:LOG_FILE

            "Configuração: $configPath" |
              Add-Content $env:LOG_FILE
          }
          catch {
            "ERRO MCP: $($_.Exception.Message)" |
              Add-Content $env:LOG_FILE
          }

      # ==========================================
      # 7. INICIAR CLAUDE DEPOIS DO MCP
      # ==========================================

      - name: Iniciar Claude
        shell: pwsh
        run: |
          if ($env:CLAUDE_EXE -and (Test-Path $env:CLAUDE_EXE)) {
            Start-Process $env:CLAUDE_EXE
            "Claude iniciado após configurar MCP." |
              Add-Content $env:LOG_FILE
          }
          else {
            "Claude não disponível para iniciar." |
              Add-Content $env:LOG_FILE
          }

      # ==========================================
      # 8. RESUMO DE CONEXÃO
      # ==========================================

      - name: Resumo de conexão
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "          RDP ULTIMATE v15"
          Write-Host "======================================"
          Write-Host "AnyDesk ID: $env:ANYDESK_ID"
          Write-Host "Claude: $env:CLAUDE_EXE"
          Write-Host "Roblox Studio: $env:ROBLOX_STUDIO_EXE"
          Write-Host "======================================"

          "Resumo de conexão exibido." | Add-Content $env:LOG_FILE

          "## AMBIENTE" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "**AnyDesk ID:** $env:ANYDESK_ID" >>
            $env:GITHUB_STEP_SUMMARY

      # ==========================================
      # 9. MANTER AMBIENTE ATIVO
      # ==========================================

      - name: Manter ambiente ativo
        shell: pwsh
        run: |
          $minutes = [int]"${{ inputs.keep_alive_minutes }}"

          if ($minutes -lt 1) { $minutes = 1 }
          if ($minutes -gt 330) { $minutes = 330 }

          $end = (Get-Date).AddMinutes($minutes)

          "Ambiente ativo por $minutes minutos." |
            Add-Content $env:LOG_FILE

          while ((Get-Date) -lt $end) {
            $remaining = [math]::Ceiling(
              ($end - (Get-Date)).TotalMinutes
            )

            Write-Host "RDP ativo. Restam $remaining minutos."
            Start-Sleep -Seconds 60
          }

      # ==========================================
      # 10. BACKUP FINAL
      # ==========================================

      - name: Preparar backup final
        if: always()
        shell: pwsh
        run: |
          $stage = "$env:WORK_DIR\FinalBackup"

          if (Test-Path $stage) {
            Remove-Item $stage -Recurse -Force
          }

          New-Item -ItemType Directory -Force $stage |
            Out-Null

          function Backup-Folder {
            param($Source, $Destination)

            if (Test-Path $Source) {
              New-Item -ItemType Directory -Force $Destination |
                Out-Null

              Get-ChildItem $Source -Force |
                Copy-Item -Destination $Destination -Recurse -Force `
                  -ErrorAction Continue
            }
          }

          Backup-Folder "$env:USERPROFILE\Downloads" `
            "$stage\Downloads"

          Backup-Folder "$env:USERPROFILE\Documents\RobloxProjects" `
            "$stage\RobloxProjects"

          Backup-Folder "$env:USERPROFILE\Documents\Roblox" `
            "$stage\Roblox"

          $config = "$env:APPDATA\Claude\claude_desktop_config.json"

          if (Test-Path $config) {
            New-Item -ItemType Directory -Force "$stage\ClaudeConfig" |
              Out-Null

            Copy-Item $config "$stage\ClaudeConfig\claude_desktop_config.json" `
              -Force
          }

          New-Item -ItemType Directory -Force "$stage\Meta" |
            Out-Null

          if (Test-Path $env:LOG_FILE) {
            Copy-Item $env:LOG_FILE "$stage\Meta\run.log" -Force
          }

          @"
          RDP Ultimate v15
          Data: $(Get-Date)
          Repository: $env:GITHUB_REPOSITORY
          Run ID: $env:GITHUB_RUN_ID
          AnyDesk ID: $env:ANYDESK_ID

          Este backup não contém credenciais ou sessões privadas.
          "@ | Set-Content "$stage\Meta\report.txt"

          "Backup final preparado." | Add-Content $env:LOG_FILE

      # ==========================================
      # 11. ENVIAR BACKUP
      # ==========================================

      - name: Salvar backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-ultimate-backup
          path: C:\RDP-Ultimate\FinalBackup\
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      # ==========================================
      # 12. RELATÓRIO
      # ==========================================

      - name: Relatório final
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========== RDP ULTIMATE v15 =========="

          if (Test-Path $env:LOG_FILE) {
            Get-Content $env:LOG_FILE
          }

          Write-Host "======================================"
          
