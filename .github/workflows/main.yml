
name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pc-virtual:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # ==========================================
      # 1. RESTAURAR BACKUP
      # ==========================================
      - name: Restaurar downloads anteriores
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $downloads = "$env:USERPROFILE\Downloads"
          $temp = "$env:RUNNER_TEMP\pc-restore"

          New-Item -ItemType Directory -Force -Path $downloads | Out-Null
          New-Item -ItemType Directory -Force -Path $temp | Out-Null

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $repo = $env:GITHUB_REPOSITORY
          $url = "https://api.github.com/repos/$repo/actions/artifacts?name=pc-virtual-downloads&per_page=100"

          try {
            $result = Invoke-RestMethod -Uri $url -Headers $headers

            $artifact = $result.artifacts |
              Where-Object {
                $_.name -eq "pc-virtual-downloads" -and
                -not $_.expired -and
                $_.workflow_run.id -ne [long]$env:GITHUB_RUN_ID
              } |
              Sort-Object created_at -Descending |
              Select-Object -First 1

            if ($artifact) {
              $archive = "$temp\backup.zip"

              Invoke-WebRequest `
                -Uri $artifact.archive_download_url `
                -Headers $headers `
                -OutFile $archive

              Expand-Archive -Path $archive -DestinationPath $downloads -Force

              Write-Host "Backup restaurado com sucesso!"
              Get-ChildItem $downloads -Force
            }
            else {
              Write-Host "Nenhum backup encontrado. Primeira execução."
            }
          }
          catch {
            Write-Warning "Falha ao restaurar backup: $_"
          }

      # ==========================================
      # 2. BAIXAR SOMENTE SE NÃO EXISTIR NO BACKUP
      # ==========================================
      - name: Preparar instaladores
        shell: pwsh
        run: |
          $downloads = "$env:USERPROFILE\Downloads"

          New-Item -ItemType Directory -Force -Path $downloads | Out-Null

          function Get-Installer {
            param(
              [string]$Name,
              [string]$Url
            )

            $file = Join-Path $downloads $Name

            if ((Test-Path $file) -and
                (Get-Item $file).Length -gt 100KB) {

              Write-Host "ARQUIVO ENCONTRADO NO BACKUP: $Name"
              return $file
            }

            if (Test-Path $file) {
              Remove-Item $file -Force
            }

            Write-Host "Baixando: $Name"

            try {
              Invoke-WebRequest `
                -Uri $Url `
                -OutFile $file `
                -UseBasicParsing `
                -TimeoutSec 600

              if (-not (Test-Path $file) -or
                  (Get-Item $file).Length -lt 100KB) {
                throw "Download incompleto: $Name"
              }

              Write-Host "Download concluído: $Name"
              return $file
            }
            catch {
              Remove-Item $file -Force -ErrorAction SilentlyContinue
              throw
            }
          }

          # AnyDesk
          $anydesk = Get-Installer `
            -Name "AnyDesk.exe" `
            -Url "https://download.anydesk.com/AnyDesk.exe"

          # Claude Desktop oficial
          $claude = Get-Installer `
            -Name "ClaudeSetup.exe" `
            -Url "https://claude.ai/api/desktop/win32/x64/setup/latest/redirect"

          # Roblox Studio oficial
          $roblox = Get-Installer `
            -Name "RobloxStudioInstaller.exe" `
            -Url "https://setup.rbxcdn.com/RobloxStudioInstaller.exe"

          Write-Host ""
          Write-Host "TODOS OS INSTALADORES ESTÃO PREPARADOS"
          Get-ChildItem $downloads -File |
            Select-Object Name, Length

      # ==========================================
      # 3. INSTALAR ANYDESK E CONFIGURAR ACESSO
      # ==========================================
      - name: Instalar AnyDesk e mostrar ID e senha
        timeout-minutes: 15
        shell: pwsh
        run: |
          $downloads = "$env:USERPROFILE\Downloads"
          $adInstaller = "$downloads\AnyDesk.exe"

          $chars = "abcdefghjkmnpqrstuvwxyz23456789".ToCharArray()
          $pw = "Ab3-" + (-join ($chars | Get-Random -Count 10))

          $ad = "C:\AnyDesk\AnyDesk.exe"

          if (-not (Test-Path $ad)) {
            Start-Process `
              -FilePath $adInstaller `
              -ArgumentList "--install C:\AnyDesk --start-with-win --silent" `
              -Wait
          }

          for ($i = 0; $i -lt 40 -and -not (Test-Path $ad); $i++) {
            Start-Sleep -Seconds 3
          }

          if (-not (Test-Path $ad)) {
            throw "AnyDesk não foi instalado."
          }

          Start-Sleep -Seconds 15

          cmd.exe /c "echo $pw| `"$ad`" --set-password"

          Start-Sleep -Seconds 5

          $id = ""

          for ($i = 0; $i -lt 12 -and -not $id; $i++) {
            $id = (& $ad --get-id | Out-String).Trim()

            if (-not $id) {
              Start-Sleep -Seconds 5
            }
          }

          if (-not $id) {
            throw "Não foi possível obter o ID do AnyDesk."
          }

          Write-Host ""
          Write-Host "================================"
          Write-Host "ID:    $id"
          Write-Host "SENHA: $pw"
          Write-Host "================================"

      # ==========================================
      # 4. INSTALAR CLAUDE DESKTOP
      # ==========================================
      - name: Instalar Claude Desktop
        timeout-minutes: 15
        shell: pwsh
        run: |
          $installer = "$env:USERPROFILE\Downloads\ClaudeSetup.exe"

          if (-not (Test-Path $installer)) {
            throw "Instalador do Claude não encontrado."
          }

          Write-Host "Iniciando instalação do Claude..."

          $process = Start-Process `
            -FilePath $installer `
            -PassThru `
            -Wait

          Write-Host "Instalador Claude finalizado."
          Write-Host "Código de saída: $($process.ExitCode)"

          $claudePaths = @(
            "$env:LOCALAPPDATA\Programs\Claude\Claude.exe",
            "$env:LOCALAPPDATA\AnthropicClaude\Claude.exe"
          )

          $installed = $false

          foreach ($path in $claudePaths) {
            if (Test-Path $path) {
              Write-Host "Claude encontrado: $path"
              $installed = $true
              break
            }
          }

          if (-not $installed) {
            Write-Warning "Não foi possível confirmar o caminho do Claude. Verifique a instalação pelo menu Iniciar."
          }

      # ==========================================
      # 5. INSTALAR ROBLOX STUDIO
      # ==========================================
      - name: Instalar Roblox Studio
        timeout-minutes: 20
        shell: pwsh
        run: |
          $installer = "$env:USERPROFILE\Downloads\RobloxStudioInstaller.exe"

          if (-not (Test-Path $installer)) {
            throw "Instalador do Roblox Studio não encontrado."
          }

          Write-Host "Iniciando instalação do Roblox Studio..."

          $process = Start-Process `
            -FilePath $installer `
            -PassThru `
            -Wait

          Write-Host "Instalador Roblox finalizado."
          Write-Host "Código de saída: $($process.ExitCode)"

          $versions = "$env:LOCALAPPDATA\Roblox\Versions"
          $studio = $null

          for ($i = 0; $i -lt 60; $i++) {

            if (Test-Path $versions) {
              $studio = Get-ChildItem `
                -Path $versions `
                -Filter "RobloxStudioBeta.exe" `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }

            if ($studio) {
              break
            }

            Start-Sleep -Seconds 5
          }

          if ($studio) {
            Write-Host "ROBLOX STUDIO INSTALADO!"
            Write-Host $studio.FullName
          }
          else {
            throw "Não foi possível confirmar a instalação do Roblox Studio."
          }

      # ==========================================
      # 6. MANTER MÁQUINA ATIVA
      # ==========================================
      - name: Manter ativo
        shell: pwsh
        run: |
          $end = (Get-Date).AddMinutes(350)

          Write-Host "Máquina virtual ativa."

          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 60
          }

      # ==========================================
      # 7. PREPARAR BACKUP
      # ==========================================
      - name: Preparar backup dos downloads
        if: always()
        shell: pwsh
        run: |
          $source = "$env:USERPROFILE\Downloads"
          $backup = "$env:RUNNER_TEMP\pc-backup\Downloads"

          New-Item -ItemType Directory -Force -Path $backup | Out-Null

          if (Test-Path $source) {
            Get-ChildItem -Path $source -Force |
              Copy-Item -Destination $backup -Recurse -Force
          }

          $files = Get-ChildItem $backup -Force

          if (-not $files) {
            New-Item -ItemType File `
              -Path "$backup\.keep" | Out-Null
          }

          Write-Host "Arquivos preparados para backup:"
          Get-ChildItem $backup -Force |
            Select-Object Name, Length

      # ==========================================
      # 8. SALVAR BACKUP NO GITHUB
      # ==========================================
      - name: Salvar downloads no GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-virtual-downloads
          path: ${{ runner.temp }}/pc-backup/Downloads/
          retention-days: 90
          if-no-files-found: warn
          
