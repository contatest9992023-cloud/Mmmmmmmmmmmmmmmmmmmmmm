
name: RDP Ultimate v16

on:
  workflow_dispatch:
    inputs:
      keep_alive_minutes:
        description: "Tempo ativo em minutos (máximo 330)"
        required: true
        type: number
        default: 330

permissions:
  actions: read
  contents: read

jobs:
  rdp:
    name: RDP Ultimate v16
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      BACKUP_NAME: rdp-ultimate-backup
      WORK_DIR: C:\RDP-Ultimate
      LOG_FILE: C:\RDP-Ultimate\run.log

    steps:

      # ==========================================
      # 1. PREPARAR AMBIENTE
      # ==========================================

      - name: Preparar ambiente
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:WORK_DIR | Out-Null

          "RDP Ultimate v16" | Set-Content $env:LOG_FILE
          "Início: $(Get-Date)" | Add-Content $env:LOG_FILE
          "Runner: $env:RUNNER_NAME" | Add-Content $env:LOG_FILE
          "Windows: $([Environment]::OSVersion.VersionString)" |
            Add-Content $env:LOG_FILE

      # ==========================================
      # 2. RESTAURAR BACKUP
      # ==========================================

      - name: Restaurar backup anterior
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $api = "https://api.github.com/repos/$env:GH_REPOSITORY/actions/artifacts?name=$env:BACKUP_NAME&per_page=100"

          try {
            $result = Invoke-RestMethod -Uri $api -Headers $headers

            $artifact = $result.artifacts |
              Where-Object { -not $_.expired } |
              Sort-Object created_at -Descending |
              Select-Object -First 1

            if ($artifact) {
              $zip = "$env:WORK_DIR\previous.zip"
              $restore = "$env:WORK_DIR\Restored"

              Invoke-WebRequest `
                -Uri $artifact.archive_download_url `
                -Headers $headers `
                -OutFile $zip

              Expand-Archive $zip $restore -Force

              function Restore-Folder {
                param($Source, $Destination)

                if (Test-Path $Source) {
                  New-Item -ItemType Directory -Force $Destination |
                    Out-Null

                  Get-ChildItem $Source -Force |
                    Copy-Item -Destination $Destination -Recurse -Force
                }
              }

              Restore-Folder "$restore\Downloads" `
                "$env:USERPROFILE\Downloads"

              Restore-Folder "$restore\RobloxProjects" `
                "$env:USERPROFILE\Documents\RobloxProjects"

              Restore-Folder "$restore\Roblox" `
                "$env:USERPROFILE\Documents\Roblox"

              $config = "$restore\ClaudeConfig\claude_desktop_config.json"

              if (Test-Path $config) {
                New-Item -ItemType Directory -Force "$env:APPDATA\Claude" |
                  Out-Null

                Copy-Item $config `
                  "$env:APPDATA\Claude\claude_desktop_config.json" -Force
              }

              "Backup restaurado: $($artifact.created_at)" |
                Add-Content $env:LOG_FILE
            }
            else {
              "Nenhum backup anterior encontrado." |
                Add-Content $env:LOG_FILE
            }
          }
          catch {
            "AVISO BACKUP: $($_.Exception.Message)" |
              Add-Content $env:LOG_FILE
          }

      # ==========================================
      # 3. ANYDESK - INSTALAÇÃO E INICIALIZAÇÃO
      # ==========================================

      - name: Instalar e iniciar AnyDesk
        id: anydesk
        shell: pwsh
        env:
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          $id = ""
          $exe = $null
          $status = "FAILED"

          try {
            $installDir = "C:\Program Files (x86)\AnyDesk"
            $downloadedExe = "$env:WORK_DIR\AnyDesk.exe"

            $locations = @(
              "$installDir\AnyDesk.exe",
              "C:\Program Files\AnyDesk\AnyDesk.exe"
            )

            # 1. Procurar instalação existente
            $exe = $locations |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1

            # 2. Baixar se não existir
            if (-not $exe) {
              Write-Host "Baixando AnyDesk..."

              Invoke-WebRequest `
                -Uri "https://download.anydesk.com/AnyDesk.exe" `
                -OutFile $downloadedExe

              if (-not (Test-Path $downloadedExe)) {
                throw "Download do AnyDesk não foi criado."
              }

              $file = Get-Item $downloadedExe

              if ($file.Length -lt 1000000) {
                throw "Arquivo AnyDesk muito pequeno ou inválido."
              }

              # 3. Tentar instalação oficial
              Write-Host "Tentando instalar AnyDesk..."

              try {
                & $downloadedExe --install $installDir `
                  --start-with-win `
                  --silent `
                  --create-shortcuts

                Start-Sleep -Seconds 12
              }
              catch {
                "Instalação retornou aviso: $($_.Exception.Message)" |
                  Add-Content $env:LOG_FILE
              }

              # 4. Procurar executável instalado
              $exe = $locations |
                Where-Object { Test-Path $_ } |
                Select-Object -First 1

              # 5. Alternativa: executar versão portátil
              if (-not $exe) {
                Write-Host "Instalação não localizada. Usando versão baixada."
                $exe = $downloadedExe
              }
            }

            if (-not (Test-Path $exe)) {
              throw "Executável AnyDesk não encontrado."
            }

            "AnyDesk executável: $exe" |
              Add-Content $env:LOG_FILE

            # 6. Iniciar aplicativo
            try {
              & $exe --start 2>&1 |
                ForEach-Object { "$_" | Add-Content $env:LOG_FILE }
            }
            catch {
              "Aviso ao iniciar serviço: $($_.Exception.Message)" |
                Add-Content $env:LOG_FILE
            }

            Start-Process -FilePath $exe
            Start-Sleep -Seconds 8

            # 7. Configurar senha no perfil correto
            if ([string]::IsNullOrWhiteSpace($env:ANYDESK_PASSWORD)) {
              throw "Secret ANYDESK_PASSWORD está vazio."
            }

            $env:ANYDESK_PASSWORD |
              & $exe --set-password _unattended_access

            $passwordExit = $LASTEXITCODE

            Start-Sleep -Seconds 5

            if ($passwordExit -ne 0) {
              throw "AnyDesk não confirmou a configuração da senha. Código: $passwordExit"
            }

            # 8. Criar script para obter o ID
            $batch = "$env:WORK_DIR\get-anydesk-id.cmd"

            @"
          @echo off
          for /f "delims=" %%i in ('"$exe" --get-id') do echo %%i
          "@ | Set-Content $batch -Encoding ASCII

            # 9. Capturar ID
            for ($i = 1; $i -le 12; $i++) {
              $result = & cmd.exe /d /c "`"$batch`"" 2>$null

              $candidate = $result |
                Where-Object {
                  "$_".Trim() -match '^[0-9]{6,}$'
                } |
                Select-Object -First 1

              if ($candidate) {
                $id = "$candidate".Trim()
                break
              }

              Start-Sleep -Seconds 5
            }

            if ($id -notmatch '^[0-9]{6,}$') {
              throw "Não foi possível capturar um ID válido."
            }

            $status = "SUCCESS"

            "AnyDesk ID: $id" | Add-Content $env:LOG_FILE
            "Senha de acesso configurada." |
              Add-Content $env:LOG_FILE

            "ANYDESK_ID=$id" >> $env:GITHUB_ENV

            "## ACESSO ANYDESK" >> $env:GITHUB_STEP_SUMMARY
            "" >> $env:GITHUB_STEP_SUMMARY
            "**ID:** $id" >> $env:GITHUB_STEP_SUMMARY
            "**Senha:** valor de ANYDESK_PASSWORD" >>
              $env:GITHUB_STEP_SUMMARY

            Write-Host ""
            Write-Host "=================================="
            Write-Host "ANYDESK ID: $id"
            Write-Host "SENHA: configurada"
            Write-Host "=================================="
          }
          catch {
            $status = "FAILED"

            "ERRO ANYDESK: $($_.Exception.Message)" |
              Tee-Object -FilePath $env:LOG_FILE -Append

            "## ANYDESK: FALHA" >> $env:GITHUB_STEP_SUMMARY
            "" >> $env:GITHUB_STEP_SUMMARY
            "$($_.Exception.Message)" >> $env:GITHUB_STEP_SUMMARY

            Write-Host "Falha no AnyDesk: $($_.Exception.Message)"
          }

          "ANYDESK_STATUS=$status" >> $env:GITHUB_ENV

      # ==========================================
      # 4. ROBLOX STUDIO
      # ==========================================

      - name: Localizar Roblox Studio
        shell: pwsh
        run: |
          try {
            $versions = "$env:LOCALAPPDATA\Roblox\Versions"

            $studio = Get-ChildItem $versions `
              -Filter "RobloxStudioBeta.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if (-not $studio) {
              $installer = Get-ChildItem "$env:USERPROFILE\Downloads" `
                -Filter "RobloxStudioInstaller*.exe" `
                -File `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($installer) {
                Start-Process $installer.FullName

                $deadline = (Get-Date).AddMinutes(4)

                do {
                  Start-Sleep -Seconds 8

                  $studio = Get-ChildItem $versions `
                    -Filter "RobloxStudioBeta.exe" `
                    -Recurse `
                    -ErrorAction SilentlyContinue |
                    Select-Object -First 1

                } while (-not $studio -and (Get-Date) -lt $deadline)
              }
            }

            if ($studio) {
              "ROBLOX_STUDIO_EXE=$($studio.FullName)" |
                Add-Content $env:GITHUB_ENV

              "Roblox Studio localizado: $($studio.FullName)" |
                Add-Content $env:LOG_FILE
            }
            else {
              "Roblox Studio não localizado." |
                Add-Content $env:LOG_FILE
            }
          }
          catch {
            "ERRO ROBLOX: $($_.Exception.Message)" |
              Add-Content $env:LOG_FILE
          }

      - name: Abrir Roblox Studio
        shell: pwsh
        run: |
          if ($env:ROBLOX_STUDIO_EXE -and
              (Test-Path $env:ROBLOX_STUDIO_EXE)) {
            Start-Process $env:ROBLOX_STUDIO_EXE
            "Roblox Studio iniciado." | Add-Content $env:LOG_FILE
          }
          else {
            "Roblox Studio indisponível." | Add-Content $env:LOG_FILE
          }

      # ==========================================
      # 5. CLAUDE DESKTOP
      # ==========================================

      - name: Localizar Claude
        shell: pwsh
        run: |
          try {
            $candidates = @(
              "$env:LOCALAPPDATA\Programs\Claude\Claude.exe",
              "$env:LOCALAPPDATA\Claude\Claude.exe",
              "$env:ProgramFiles\Claude\Claude.exe"
            )

            $claude = $candidates |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1

            if (-not $claude) {
              $installer = Get-ChildItem "$env:USERPROFILE\Downloads" `
                -Filter "*Claude*Setup*.exe" `
                -File `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($installer) {
                Start-Process $installer.FullName

                $deadline = (Get-Date).AddMinutes(3)

                do {
                  Start-Sleep -Seconds 5

                  $claude = $candidates |
                    Where-Object { Test-Path $_ } |
                    Select-Object -First 1

                } while (-not $claude -and (Get-Date) -lt $deadline)
              }
            }

            if ($claude) {
              "CLAUDE_EXE=$claude" >> $env:GITHUB_ENV
              "Claude localizado: $claude" |
                Add-Content $env:LOG_FILE
            }
            else {
              "Claude não localizado." | Add-Content $env:LOG_FILE
            }
          }
          catch {
            "ERRO CLAUDE: $($_.Exception.Message)" |
              Add-Content $env:LOG_FILE
          }

      # ==========================================
      # 6. CONFIGURAR MCP
      # ==========================================

      - name: Configurar MCP do Roblox
        shell: pwsh
        run: |
          try {
            $mcp = Get-ChildItem "$env:LOCALAPPDATA\Roblox" `
              -Filter "mcp.bat" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if (-not $mcp) {
              "mcp.bat não encontrado. MCP não alterado." |
                Add-Content $env:LOG_FILE
              return
            }

            $configDir = "$env:APPDATA\Claude"
            $configPath = "$configDir\claude_desktop_config.json"

            New-Item -ItemType Directory -Force $configDir |
              Out-Null

            if (Test-Path $configPath) {
              $raw = Get-Content $configPath -Raw

              if ([string]::IsNullOrWhiteSpace($raw)) {
                $config = @{}
              }
              else {
                $config = $raw | ConvertFrom-Json -AsHashtable
              }
            }
            else {
              $config = @{}
            }

            if (-not $config.ContainsKey("mcpServers") -or
                $config["mcpServers"] -isnot [System.Collections.IDictionary]) {
              $config["mcpServers"] = @{}
            }

            $command = 'cd /d "' +
              $mcp.Directory.FullName +
              '" && call mcp.bat'

            $config["mcpServers"]["Roblox_Studio"] = @{
              command = "cmd.exe"
              args = @("/d", "/c", $command)
            }

            $config |
              ConvertTo-Json -Depth 30 |
              Set-Content $configPath -Encoding UTF8

            "MCP configurado: $($mcp.FullName)" |
              Add-Content $env:LOG_FILE
          }
          catch {
            "ERRO MCP: $($_.Exception.Message)" |
              Add-Content $env:LOG_FILE
          }

      # ==========================================
      # 7. INICIAR CLAUDE
      # ==========================================

      - name: Iniciar Claude
        shell: pwsh
        run: |
          if ($env:CLAUDE_EXE -and (Test-Path $env:CLAUDE_EXE)) {
            Start-Process $env:CLAUDE_EXE
            "Claude iniciado." | Add-Content $env:LOG_FILE
          }
          else {
            "Claude não disponível." | Add-Content $env:LOG_FILE
          }

      # ==========================================
      # 8. RESUMO
      # ==========================================

      - name: Resumo do ambiente
        shell: pwsh
        run: |
          Write-Host "========== RDP ULTIMATE v16 =========="
          Write-Host "AnyDesk ID: $env:ANYDESK_ID"
          Write-Host "AnyDesk Status: $env:ANYDESK_STATUS"
          Write-Host "Claude: $env:CLAUDE_EXE"
          Write-Host "Roblox: $env:ROBLOX_STUDIO_EXE"

          "## RESULTADO" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "**AnyDesk:** $env:ANYDESK_STATUS" >>
            $env:GITHUB_STEP_SUMMARY

      # ==========================================
      # 9. MANTER AMBIENTE ATIVO
      # ==========================================

      - name: Manter ambiente ativo
        shell: pwsh
        run: |
          $minutes = [int]"${{ inputs.keep_alive_minutes }}"

          if ($minutes -lt 1) { $minutes = 1 }
          if ($minutes -gt 330) { $minutes = 330 }

          $end = (Get-Date).AddMinutes($minutes)

          "Ambiente ativo por $minutes minutos." |
            Add-Content $env:LOG_FILE

          while ((Get-Date) -lt $end) {
            $remaining = [math]::Ceiling(
              ($end - (Get-Date)).TotalMinutes
            )

            Write-Host "Ambiente ativo. Restam $remaining minutos."
            Start-Sleep -Seconds 60
          }

      # ==========================================
      # 10. BACKUP FINAL
      # ==========================================

      - name: Preparar backup final
        if: always()
        shell: pwsh
        run: |
          $stage = "$env:WORK_DIR\FinalBackup"

          if (Test-Path $stage) {
            Remove-Item $stage -Recurse -Force
          }

          New-Item -ItemType Directory -Force $stage |
            Out-Null

          function Backup-Folder {
            param($Source, $Destination)

            if (Test-Path $Source) {
              New-Item -ItemType Directory -Force $Destination |
                Out-Null

              Get-ChildItem $Source -Force |
                Copy-Item -Destination $Destination -Recurse -Force `
                  -ErrorAction Continue
            }
          }

          Backup-Folder "$env:USERPROFILE\Downloads" `
            "$stage\Downloads"

          Backup-Folder "$env:USERPROFILE\Documents\RobloxProjects" `
            "$stage\RobloxProjects"

          Backup-Folder "$env:USERPROFILE\Documents\Roblox" `
            "$stage\Roblox"

          $config = "$env:APPDATA\Claude\claude_desktop_config.json"

          if (Test-Path $config) {
            New-Item -ItemType Directory -Force "$stage\ClaudeConfig" |
              Out-Null

            Copy-Item $config `
              "$stage\ClaudeConfig\claude_desktop_config.json" -Force
          }

          New-Item -ItemType Directory -Force "$stage\Meta" |
            Out-Null

          if (Test-Path $env:LOG_FILE) {
            Copy-Item $env:LOG_FILE "$stage\Meta\run.log" -Force
          }

          @"
          RDP Ultimate v16
          Data: $(Get-Date)
          Repository: $env:GITHUB_REPOSITORY
          Run ID: $env:GITHUB_RUN_ID
          AnyDesk ID: $env:ANYDESK_ID
          AnyDesk Status: $env:ANYDESK_STATUS

          Backup sem credenciais ou sessões privadas.
          "@ | Set-Content "$stage\Meta\report.txt"

      # ==========================================
      # 11. ENVIAR BACKUP
      # ==========================================

      - name: Salvar backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdp-ultimate-backup
          path: C:\RDP-Ultimate\FinalBackup\
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      # ==========================================
      # 12. RELATÓRIO FINAL
      # ==========================================

      - name: Relatório final
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========== RDP ULTIMATE v16 =========="

          if (Test-Path $env:LOG_FILE) {
            Get-Content $env:LOG_FILE
          }

          Write-Host "======================================"
          
