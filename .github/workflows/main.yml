
name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pc-virtual:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ==========================================
      # 1. RESTAURAR DOWNLOADS ANTERIORES
      # ==========================================

      - name: Restaurar downloads anteriores
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $downloads = "$env:USERPROFILE\Downloads"
          $temp = "$env:RUNNER_TEMP\pc-restore"

          New-Item -ItemType Directory -Force -Path $downloads | Out-Null
          New-Item -ItemType Directory -Force -Path $temp | Out-Null

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $repo = $env:GITHUB_REPOSITORY
          $url = "https://api.github.com/repos/$repo/actions/artifacts?name=pc-virtual-downloads&per_page=100"

          try {
            $result = Invoke-RestMethod -Uri $url -Headers $headers

            $artifact = $result.artifacts |
              Where-Object {
                $_.name -eq "pc-virtual-downloads" -and
                -not $_.expired -and
                $_.workflow_run.id -ne [long]$env:GITHUB_RUN_ID
              } |
              Sort-Object created_at -Descending |
              Select-Object -First 1

            if ($artifact) {
              $archive = "$temp\backup.zip"

              Invoke-WebRequest `
                -Uri $artifact.archive_download_url `
                -Headers $headers `
                -OutFile $archive

              Expand-Archive -Path $archive -DestinationPath $downloads -Force

              Write-Host "Downloads restaurados!"
            }
            else {
              Write-Host "Nenhum backup anterior encontrado."
            }
          }
          catch {
            Write-Warning "Falha ao restaurar downloads: $_"
          }

      # ==========================================
      # 2. INSTALAR CLAUDE DESKTOP
      # ==========================================

      - name: Instalar Claude Desktop
        shell: pwsh
        timeout-minutes: 15
        run: |
          $downloads = "$env:USERPROFILE\Downloads"

          $claude = Get-ChildItem $downloads -File -Recurse |
            Where-Object {
              $_.Name -match '^Claude.*\.exe$'
            } |
            Select-Object -First 1

          if (-not $claude) {
            throw "Claude Setup.exe não encontrado."
          }

          Write-Host "Instalador: $($claude.FullName)"

          $signature = Get-AuthenticodeSignature $claude.FullName

          if ($signature.Status -ne "Valid") {
            throw "Assinatura do Claude inválida."
          }

          $process = Start-Process `
            -FilePath $claude.FullName `
            -Wait `
            -PassThru

          Write-Host "Código de saída: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
            throw "Falha ao instalar Claude: $($process.ExitCode)"
          }

          Write-Host "Instalador Claude finalizado!"

      # ==========================================
      # 3. INICIAR INSTALADOR ROBLOX STUDIO
      # ==========================================

      - name: Iniciar instalação Roblox Studio
        shell: pwsh
        timeout-minutes: 5
        run: |
          $downloads = "$env:USERPROFILE\Downloads"

          $studio = Get-ChildItem $downloads -File -Recurse |
            Where-Object {
              $_.Name -match '^RobloxStudio.*\.exe$'
            } |
            Select-Object -First 1

          if (-not $studio) {
            throw "Instalador Roblox Studio não encontrado."
          }

          Write-Host "Instalador: $($studio.FullName)"

          $signature = Get-AuthenticodeSignature $studio.FullName

          if ($signature.Status -ne "Valid") {
            throw "Assinatura do Roblox inválida."
          }

          $process = Start-Process `
            -FilePath $studio.FullName `
            -PassThru

          Write-Host "Instalador iniciado."
          Write-Host "PID: $($process.Id)"

      # ==========================================
      # 4. INSTALAR ANYDESK
      # ==========================================

      - name: Instalar AnyDesk e mostrar ID e senha
        shell: pwsh
        timeout-minutes: 15
        run: |
          $chars = "abcdefghjkmnpqrstuvwxyz23456789".ToCharArray()

          $pw = "Ab3-" + (-join ($chars | Get-Random -Count 10))

          $ad = "C:\AnyDesk\AnyDesk.exe"

          Invoke-WebRequest `
            -Uri "https://download.anydesk.com/AnyDesk.exe" `
            -OutFile "$env:TEMP\AnyDesk.exe"

          Start-Process `
            "$env:TEMP\AnyDesk.exe" `
            -ArgumentList "--install C:\AnyDesk --start-with-win --silent"

          for ($i = 0; $i -lt 40 -and -not (Test-Path $ad); $i++) {
            Start-Sleep -Seconds 3
          }

          if (-not (Test-Path $ad)) {
            throw "AnyDesk não foi instalado."
          }

          Start-Sleep -Seconds 15

          cmd /c "echo $pw | ""$ad"" --set-password"

          Start-Sleep -Seconds 5

          $id = ""

          for ($i = 0; $i -lt 12 -and -not $id; $i++) {
            $id = (& $ad --get-id | Out-String).Trim()

            if (-not $id) {
              Start-Sleep -Seconds 5
            }
          }

          if (-not $id) {
            throw "Não foi possível obter o ID do AnyDesk."
          }

          Write-Host ""
          Write-Host "================================"
          Write-Host "ID:    $id"
          Write-Host "SENHA: $pw"
          Write-Host "================================"

      # ==========================================
      # 5. AGUARDAR INSTALAÇÃO E VERIFICAR MCP
      # ==========================================

      - name: Verificar Roblox Studio e MCP
        shell: pwsh
        timeout-minutes: 20
        run: |
          $robloxDir = "$env:LOCALAPPDATA\Roblox"
          $mcp = "$robloxDir\mcp.bat"

          Write-Host "Aguardando instalação do Roblox Studio..."

          $found = $false

          for ($i = 0; $i -lt 180; $i++) {

            if (Test-Path $mcp) {
              $found = $true
              break
            }

            $studioExe = Get-ChildItem `
              "$robloxDir\Versions" `
              -Filter "RobloxStudioBeta.exe" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($studioExe) {
              Write-Host "Executável encontrado: $($studioExe.FullName)"
            }

            Start-Sleep -Seconds 5
          }

          if (-not $found) {
            Write-Host "Conteúdo da pasta Roblox:"

            if (Test-Path $robloxDir) {
              Get-ChildItem $robloxDir -Force -Recurse |
                Select-Object -First 100 FullName |
                ForEach-Object { Write-Host $_.FullName }
            }

            throw "mcp.bat não apareceu. Verifique a instalação ou atualize o Roblox Studio."
          }

          Write-Host "MCP encontrado: $mcp"

      # ==========================================
      # 6. CONFIGURAR MCP NO CLAUDE
      # ==========================================

      - name: Configurar Roblox MCP no Claude
        shell: pwsh
        run: |
          $configDir = "$env:APPDATA\Claude"
          $configFile = Join-Path $configDir "claude_desktop_config.json"

          $mcp = "$env:LOCALAPPDATA\Roblox\mcp.bat"

          if (-not (Test-Path $mcp)) {
            throw "mcp.bat não encontrado."
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $configDir | Out-Null

          $config = @{
            mcpServers = @{
              Roblox_Studio = @{
                command = "cmd.exe"
                args = @(
                  "/c",
                  "%LOCALAPPDATA%\Roblox\mcp.bat"
                )
              }
            }
          }

          $config | ConvertTo-Json -Depth 10 |
            Set-Content -Path $configFile -Encoding UTF8

          $check = Get-Content $configFile -Raw | ConvertFrom-Json

          if (-not $check.mcpServers.Roblox_Studio) {
            throw "Falha ao validar configuração MCP."
          }

          Write-Host "Configuração MCP criada e validada!"

      # ==========================================
      # 7. ABRIR ROBLOX STUDIO
      # ==========================================

      - name: Abrir Roblox Studio
        shell: pwsh
        run: |
          $robloxDir = "$env:LOCALAPPDATA\Roblox\Versions"

          $studio = Get-ChildItem `
            $robloxDir `
            -Filter "RobloxStudioBeta.exe" `
            -File `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $studio) {
            throw "RobloxStudioBeta.exe não encontrado."
          }

          Start-Process $studio.FullName

          Write-Host "Roblox Studio iniciado!"

      # ==========================================
      # 8. MANTER PC ATIVO
      # ==========================================

      - name: Manter ativo
        shell: pwsh
        run: |
          Write-Host "PC virtual iniciado!"

          $end = (Get-Date).AddMinutes(350)

          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 60
          }

      # ==========================================
      # 9. PREPARAR BACKUP DOS DOWNLOADS
      # ==========================================

      - name: Preparar backup dos downloads
        if: always()
        shell: pwsh
        run: |
          $source = "$env:USERPROFILE\Downloads"
          $backup = "$env:RUNNER_TEMP\pc-backup\Downloads"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $backup | Out-Null

          if (Test-Path $source) {
            Copy-Item `
              "$source\*" `
              $backup `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue
          }

          if (-not (Get-ChildItem $backup -Force)) {
            New-Item `
              -ItemType File `
              -Path "$backup\.keep" | Out-Null
          }

          Write-Host "Backup preparado!"

      # ==========================================
      # 10. SALVAR DOWNLOADS NO GITHUB
      # ==========================================

      - name: Salvar downloads no GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-virtual-downloads
          path: ${{ runner.temp }}/pc-backup/Downloads/
          retention-days: 90
          if-no-files-found: warn
          
